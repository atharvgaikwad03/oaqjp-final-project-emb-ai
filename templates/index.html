<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detection</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        h1 { color: #333; }
        textarea { width: 100%; height: 100px; padding: 10px; font-size: 16px; }
        button { margin-top: 10px; padding: 10px 20px; background: #0062ff; color: white; border: none; cursor: pointer; font-size: 16px; }
        button:hover { background: #0043ce; }
        #output { margin-top: 20px; padding: 15px; background: #f4f4f4; border-radius: 5px; font-size: 16px; }
    </style>
</head>
<body>
    <h1>Emotion Detection Application</h1>
    <p>Enter text below to detect the dominant emotion:</p>
    <textarea id="textToAnalyse" placeholder="Enter text here..."></textarea>
    <br>
    <button onclick="RunSentimentAnalysis()">Analyse</button>
    <div id="output"></div>
    <script src="/static/mywebscript.js"></script>
</body>
</html>
